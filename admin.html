<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود مدیریت | نوسان بازار</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #222;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 28px;
        }

        .logo p {
            margin: 8px 0 0;
            color: #777;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 15px;
            direction: ltr;
        }

        input:focus {
            outline: none;
            border-color: #222;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .error {
            display: none;
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            color: #777;
            margin-top: 15px;
            font-size: 13px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #777;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #111;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        <h1>نوسان بازار</h1>
        <p>ورود به بخش مدیریت</p>
    </div>

    <div id="errorMessage" class="error"></div>

    <form id="loginForm">

        <label for="email">ایمیل</label>
        <input
            type="email"
            id="email"
            placeholder="ایمیل مدیریت"
            required
            autocomplete="email"
        >

        <label for="password">رمز عبور</label>
        <input
            type="password"
            id="password"
            placeholder="رمز عبور"
            required
            autocomplete="current-password"
        >

        <button type="submit" id="loginButton">
            ورود
        </button>

        <div id="loading" class="loading">
            در حال ورود...
        </div>

    </form>

    <a href="index.html" class="back">
        ← بازگشت به صفحه اصلی
    </a>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    /*
        ==========================================
        SUPABASE SETTINGS
        ==========================================

        We will put your Supabase project URL
        and Publishable/Anon key here.

        DO NOT put your database password here.
        DO NOT put your Service Role key here.
    */

    const SUPABASE_URL = "https://dszwwlsudhyguppjavyt.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_c73-iGnl_q0l7X24-A3SJA_fQZxXXLn";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    // Login form
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const errorMessage = document.getElementById("errorMessage");
    const loading = document.getElementById("loading");


    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        errorMessage.style.display = "none";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;


        loginButton.disabled = true;
        loading.style.display = "block";


        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


        if (error) {

            console.error(error);

            errorMessage.textContent =
                "ایمیل یا رمز عبور اشتباه است.";

            errorMessage.style.display = "block";

            loginButton.disabled = false;
            loading.style.display = "none";

            return;
        }


        // Successful login
       alert("LOGIN SUCCESSFUL!");

    });

</script>

</body>
</html>
