<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نوسان بازار</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f3f3;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 16px;
        }

        .update-box {
            text-align: center;
            margin: 20px 0;
            font-size: 14px;
            color: #666;
        }

        .table-wrapper {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #222;
            color: white;
            padding: 18px 10px;
            font-size: 16px;
        }

        td {
            padding: 18px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .item-name {
            font-weight: bold;
        }

        .price {
            font-weight: bold;
        }

        .buy-price {
            color: #16803c;
        }

        .sell-price {
            color: #c0392b;
        }

        .request-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .request-button {
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: white;
            transition: 0.2s;
            display: inline-block;
        }

        .buy-button {
            background: #16803c;
        }

        .sell-button {
            background: #c0392b;
        }

        .request-button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }
