<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نوسان بازار</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f3f3;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 16px;
        }

        .update-box {
            text-align: center;
            margin: 20px 0;
            font-size: 14px;
            color: #666;
        }

        .table-wrapper {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #222;
            color: white;
            padding: 18px 10px;
            font-size: 16px;
        }

        td {
            padding: 18px 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .item-name {
            font-weight: bold;
        }

        .price {
            font-weight: bold;
        }

        .buy-price {
            color: #16803c;
        }

        .sell-price {
            color: #c0392b;
        }

        .request-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .request-button {
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: white;
            transition: 0.2s;
        }

        .buy-button {
            background: #16803c;
        }

        .sell-button {
            background: #c0392b;
        }

        .request-button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #c0392b;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .container {
                margin: 15px auto;
                padding: 10px;
            }

            .header h1 {
                font-size: 26px;
            }

            th, td {
                padding: 12px 5px;
                font-size: 13px;
            }

            .request-button {
                padding: 7px 9px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>نوسان بازار</h1>
        <p>قیمت خرید و فروش</p>
    </div>

    <div class="update-box">
        آخرین بروزرسانی:
        <strong id="lastUpdate">در حال دریافت...</strong>
    </div>

    <div class="table-wrapper">

        <div id="loading" class="loading">
            در حال دریافت قیمت‌ها...
        </div>

        <div id="error" class="error" style="display:none;">
            دریافت قیمت‌ها با مشکل مواجه شد.
        </div>

        <table id="priceTable" style="display:none;">

            <thead>
                <tr>
                    <th>کالا</th>
                    <th>خرید</th>
                    <th>فروش</th>
                    <th>درخواست</th>
                </tr>
            </thead>

            <tbody id="priceTableBody">
            </tbody>

        </table>

    </div>

</div>

<script>

    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
        "https://dszwwlsudhyguppjavyt.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_c73-iGnl_q0l7X24-A3SJA_fQZxXXLn";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    // ==============================
    // FORMAT PRICE
    // ==============================

    function formatPrice(price) {

        if (price === null || price === undefined) {
            return "—";
        }

        return Number(price).toLocaleString("en-US");
    }


    // ==============================
    // FORMAT DATE
    // ==============================

    function formatDate(dateString) {

        if (!dateString) {
            return "—";
        }

        const date = new Date(dateString);

        return date.toLocaleTimeString("fa-IR", {
            hour: "2-digit",
            minute: "2-digit"
        });
    }


    // ==============================
    // LOAD PRICES
    // ==============================

    async function loadPrices() {

        try {

            const {
                data,
                error
            } = await supabaseClient
                .from("prices")
                .select("*")
                .order("id", {
                    ascending: true
                });

            if (error) {
                throw error;
            }


            // Clear existing rows

            const tbody =
                document.getElementById("priceTableBody");

            tbody.innerHTML = "";


            // No data

            if (!data || data.length === 0) {

                document.getElementById("loading").style.display =
                    "none";

                document.getElementById("error").style.display =
                    "block";

                return;
            }


            // Create rows

            data.forEach(item => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td class="item-name">
                        ${item.item_name}
                    </td>

                    <td class="price buy-price">
                        ${formatPrice(item.buy_price)}
                    </td>

                    <td class="price sell-price">
                        ${formatPrice(item.sell_price)}
                    </td>

                    <td>

                        <div class="request-buttons">

                            <a
                                class="request-button buy-button"
                                href="order.html?item=${encodeURIComponent(item.item_name)}&type=buy"
                            >
                                خرید
                            </a>

                            <a
                                class="request-button sell-button"
                                href="order.html?item=${encodeURIComponent(item.item_name)}&type=sell"
                            >
                                فروش
                            </a>

                        </div>

                    </td>

                `;


                tbody.appendChild(row);

            });


            // Find latest update

            let latestUpdate = null;

            data.forEach(item => {

                if (
                    !latestUpdate ||
                    new Date(item.updated_at) >
                    new Date(latestUpdate)
                ) {

                    latestUpdate =
                        item.updated_at;

                }

            });


            document.getElementById("lastUpdate").textContent =
                formatDate(latestUpdate);


            // Show table

            document.getElementById("loading").style.display =
                "none";

            document.getElementById("error").style.display =
                "none";

            document.getElementById("priceTable").style.display =
                "table";

        }

        catch (error) {

            console.error(
                "Error loading prices:",
                error
            );

            document.getElementById("loading").style.display =
                "none";

            document.getElementById("error").style.display =
                "block";

        }

    }


    // ==============================
    // INITIAL LOAD
    // ==============================

    loadPrices();


    // ==============================
    // AUTO REFRESH
    // Every 30 seconds
    // ==============================

    setInterval(
        loadPrices,
        30000
    );

</script>

</body>
</html>
